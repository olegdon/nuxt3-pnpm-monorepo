name: Build environment
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
      with:
        version: 12.3.4
    - uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: pnpm
    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
